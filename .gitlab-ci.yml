image: node:22

default:
  interruptible: true
  timeout: 5 minutes
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

stages:
  - test

test:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  script:
    - npm run test

# NOTE: there is no deploy job here any more. GitLab is a mirror of the nostr
# repo and runs tests on its own runner; nostrhub.io is published as an nsite
# by .ngit/act/workflows/deploy-nsite.yml, which runs on the ngit-ci
# coordinator. Nothing is rsynced to venus and nothing is hosted on GitLab.
